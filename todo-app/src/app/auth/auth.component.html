<div class="row">
    <div class="col-3">

    </div>
    <div class="col-6 d-flex flex-column align-items-center justify-content-center">
        <div class="loginForm">
            <form class="d-flex flex-column align-items-center justify-content-center mw-100" 
            [formGroup]="loginForm" (submit)="onSubmit()">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required email formControlName="emailFC">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6" formControlName="passwordFC">
                </div>
                @if(isLoading()){
                    <div class="d-flex justify-content-center align-items-center"> 
                        <div class="loader"></div>
                    </div>
                }
                @else {
                    <input type="submit" class="btn btn-outline-primary" 
                [value]="loginMode()? 'Login':'Sign Up'">
                <button type="button" class="btn btn-link" (click)="loginMode.set(!loginMode())">
                    @if(loginMode()){ 
                        Don't have an account? Click here to sign up!
                    }
                    @else{
                        Already have an account? Click here to login!
                    }
                </button>
                }     
            </form>
            @if(errorSig()){
                <div class="alert alert-danger" role="alert">
                    {{ errorSig() }}
                </div>
            }
        </div>
    </div>
    <div class="col-3">

    </div>
</div>
