<form [formGroup]="surveyForm">
    <mat-stepper formArrayName="steps" orientation="vertical">
        <mat-step formGroupName="0" [stepControl]="surveyForm.controls.steps.get([0])!">
            <div>
                <mat-form-field>
                    <mat-label>Name</mat-label>
                    <input matInput type="text" required formControlName="name">
                </mat-form-field>
            </div>
            <div>
                <mat-form-field>
                    <mat-label>Age</mat-label>
                    <input matInput type="number" required min="18" formControlName="age">
                </mat-form-field>
            </div>
            <div>
                <mat-label>Gender</mat-label>
                <mat-radio-group matInput formControlName="gender">
                    <mat-radio-button value="Male">Male</mat-radio-button>
                    <mat-radio-button value="Female">Female</mat-radio-button>
                </mat-radio-group>
            </div>
            <div>
                <mat-form-field>
                    <mat-label>Nationality</mat-label>
                    <mat-select matInput formControlName="nationality">
                        <mat-option value="Egyptian">Egyptian</mat-option>
                        <mat-option value="Syrian">Syrian</mat-option>
                        <mat-option value="Guatemalan">Guatemalan</mat-option>
                        <mat-option value="Russian">Russian</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div>
                <mat-checkbox formControlName="termsAndConditions">
                    I agree to the terms and conditions
                </mat-checkbox>
            </div>
            <div>
                <button matButton matStepperNext type="button">Next</button>
            </div>
        </mat-step>
        <mat-step formGroupName="1" [stepControl]="surveyForm.controls.steps.get([1])!">
            <div>
                <mat-form-field>
                    <mat-label>Rate the app from 1 to 5</mat-label>
                    <input matInput type="number" required min="1" max="5" formControlName="rate">
                </mat-form-field>
            </div>
            <div>
                <mat-form-field>
                    <mat-label>What did you like about the app?</mat-label>
                    <textarea matInput type="text" formControlName="liked"></textarea>
                </mat-form-field>
            </div>
            <div>
                <mat-form-field>
                    <mat-label>What didn't you like about the app?</mat-label>
                    <textarea matInput type="text" formControlName="disliked"></textarea>
                </mat-form-field>
            </div>
            <div>
                <button matButton matStepperPrevious type="button">Back</button>
                <button matButton matStepperNext type="button">Next</button>
            </div>
        </mat-step>
        <mat-step formGroupName="2" [stepControl]="surveyForm.controls.steps.get([2])!">
            <div>
                <mat-form-field>
                    <mat-label>Do you have additional comments?</mat-label>
                    <textarea matInput type="text" formControlName="additionalComments">
                    </textarea>
                </mat-form-field>
            </div>
            <div>
                <button matButton matStepperPrevious type="button">Back</button>
                <input matButton type="submit" value="Submit">
            </div>
        </mat-step>
    </mat-stepper>
</form>
